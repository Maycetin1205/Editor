name: Prüfung

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:runtime
      - run: npx tsc -b
      - run: npx eslint src
      - run: npx prettier --check .
      - run: npm run knip
      - run: npm run cycles
      - run: npx vite build
