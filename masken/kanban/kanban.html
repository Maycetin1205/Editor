  <style>
/*STIL*/

/* Empfang: Anordnung der Tafel. Alle Werte kommen aus dem gemeinsamen Stil. */
html,
body {
  height: 100%;
}

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.unterzeile {
  display: flex;
  gap: var(--abstand-3);
  color: var(--tinte-3);
  font-size: var(--text-klein);
}

.suche {
  width: 15rem;
}

.suche .eingabe {
  background: var(--grund);
}

.suche .eingabe:focus {
  background: var(--flaeche);
}

.uhr {
  min-width: 3rem;
  color: var(--tinte-2);
  font-weight: var(--halbfett);
  text-align: right;
}

.tafel {
  display: grid;
  flex: 1;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--abstand-5);
  min-height: 0;
  padding: var(--abstand-5);
  user-select: none;
}

/* Eine Spalte: Kopf mit Titel und Zähler, darunter die Karten */
.spalte {
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-radius: var(--radius-spalte);
  background: var(--grund-tief);
}

.spalte-kopf {
  display: flex;
  align-items: baseline;
  gap: var(--abstand-2);
  padding: var(--abstand-4) var(--abstand-4) var(--abstand-3);
}

.spalte-titel {
  font-size: var(--text);
}

.spalte-zahl {
  color: var(--tinte-3);
  font-size: var(--text-neben);
  font-weight: var(--halbfett);
}

.spalte-inhalt {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: var(--abstand-3);
  min-height: 0;
  padding: 0 var(--abstand-3) var(--abstand-3);
  overflow-y: auto;
  border-radius: var(--radius-spalte);
  transition: background-color var(--dauer);
}

.ziel {
  background: var(--flaeche-hover);
  outline: var(--fokus) solid var(--linie-stark);
  outline-offset: calc(var(--fokus) * -1);
}

/* Eine Karte */
.karte {
  flex: none;
  padding: var(--abstand-4);
  border: var(--rand) solid var(--linie);
  border-radius: var(--radius-gross);
  background: var(--flaeche);
  box-shadow: var(--schatten-karte);
  cursor: grab;
  transition: border-color var(--dauer);
}

.karte:hover,
.karte.offen {
  border-color: var(--linie-stark);
}

.karte:focus-visible {
  outline: none;
  border-color: var(--akzent);
  box-shadow: var(--fokus-ring);
}

.karte.gezogen {
  opacity: 0.4;
}

.karte-kopf {
  display: grid;
  grid-template-columns: var(--foto) minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--abstand-3);
}

.karte-name,
.karte-besitzer {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.karte-name {
  font-weight: var(--halbfett);
  letter-spacing: var(--laufweite-eng);
}

.karte-art {
  margin-left: var(--abstand-2);
  color: var(--tinte-3);
  font-size: var(--text-neben);
  font-weight: normal;
  letter-spacing: normal;
}

.karte-besitzer {
  color: var(--tinte-2);
  font-size: var(--text-neben);
}

.karte-kopf .marke {
  align-self: start;
}

.karte-grund {
  display: -webkit-box;
  margin-top: var(--abstand-3);
  overflow: hidden;
  color: var(--tinte-2);
  font-size: var(--text-neben);
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.karte-fuss {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--abstand-3);
  margin-top: var(--abstand-3);
  padding-top: var(--abstand-3);
  border-top: var(--rand) solid var(--linie);
  color: var(--tinte-3);
  font-size: var(--text-klein);
}

/* Die Zimmer der Spalte Behandlung: Ablage mit Belegt oder Frei */
.zimmer {
  display: flex;
  flex: none;
  flex-direction: column;
  gap: var(--abstand-2);
  padding: var(--abstand-3);
  border: var(--rand) solid var(--linie);
  border-radius: var(--radius-gross);
  background: var(--flaeche-leise);
  transition: background-color var(--dauer);
}

.zimmer-kopf {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--abstand-3);
  padding: 0 var(--abstand-1);
  font-size: var(--text-neben);
}

.zimmer-zusatz {
  margin-left: var(--abstand-2);
  color: var(--tinte-3);
  font-weight: normal;
  letter-spacing: normal;
}

.zimmer-stand {
  color: var(--tinte-3);
  font-size: var(--text-klein);
}

.zimmer-leer {
  min-height: 3.5rem;
  border-radius: var(--radius);
  background: var(--flaeche);
}

/* Termin anlegen */
.tier-liste {
  display: grid;
  gap: var(--abstand-2);
}

.neues-tier {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--abstand-3);
}

.neues-tier > :first-child {
  grid-column: 1 / -1;
}

@media (max-width: 1499px) {
  .kennzahlen {
    display: none;
  }
}

    <section class="spalte" aria-labelledby="titel-behandlung">

    </section>
    <section class="spalte" aria-labelledby="titel-abrechnung">

  <dialog class="lade" id="lade" aria-labelledby="ladeTitel">

      <header class="lade-kopf">
        <h2 class="lade-titel" id="ladeTitel">Termin anlegen</h2>
        <button class="knopf knopf-leise knopf-symbol" id="schliessen" type="button" aria-label="Schließen">
          <svg class="symbol" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </header>
      <div class="lade-inhalt">
        <div class="feld">
          <label class="feld-name" for="besitzer">Besitzer</label>
          <input class="eingabe" id="besitzer" maxlength="60" autocomplete="off" role="combobox" autofocus
                 aria-autocomplete="list" aria-expanded="false" aria-controls="besitzerListe">
          <ul class="vorschlaege" id="besitzerListe" role="listbox" hidden></ul>
        </div>
        <fieldset class="gruppe">
          <legend class="feld-name">Tier</legend>
          <div class="tier-liste" id="tierListe"></div>

            <label class="feld"><span class="feld-name">Tierart</span><input class="eingabe" id="tierArt" maxlength="30" list="tierarten" autocomplete="off"></label>
            <label class="feld"><span class="feld-name">Rasse</span><input class="eingabe" id="tierRasse" maxlength="30" list="rassen" autocomplete="off"></label>
          </div>
          <datalist id="tierarten"></datalist>
          <datalist id="rassen"></datalist>
        </fieldset>
        <label class="feld"><span class="feld-name">Grund</span><input class="eingabe" id="behandlung" maxlength="150" autocomplete="off"></label>
        <div class="reihe">
          <label class="feld"><span class="feld-name">Uhrzeit</span><input class="eingabe zahl" id="uhrzeit" type="time"></label>
          <label class="wahl"><input type="checkbox" id="notfall">Notfall</label>
        </div>
        <fieldset class="gruppe">
          <legend class="feld-name">Wohin</legend>
          <div class="reihe">
            <label class="wahl"><input type="radio" name="wohin" value="termin" checked>Nicht zugewiesen</label>

          </div>
        </fieldset>

      <footer class="lade-fuss">

        <button class="knopf knopf-haupt knopf-breit" id="anlegen" type="submit">Eintragen</button>
      </footer>
    </form>
  </dialog>

    const PROTOKOLL = CONFIG.protokoll || readDebugFlag();

    function readDebugFlag() {
      try { return localStorage.getItem('ff-debug') === '1'; } catch (e) { return false; }
    }

    function log(...args) {
      if (PROTOKOLL) console.log('[Empfang]', ...args);

    // ---------------------------------------------------------------------
    //  Hilfen: Text, Datum, Uhrzeit
    // ---------------------------------------------------------------------
    function esc(text) {
      return String(text == null ? '' : text)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // Zum Vergleichen beim Suchen: klein, ohne Umlaute und Zeichen.
    function plain(text) {
      return String(text || '').toLowerCase()
        .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
        .normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/[^a-z0-9]/g, '');
    }

    function same(a, b) {
      return String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();
    }

    function plainNumber(n) {
      return String(n || '').trim().replace(/^0+/, '');
    }

    function pad2(n) {
      return String(n).padStart(2, '0');
    }

    function todayText() {
      const d = new Date();
      return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + d.getFullYear();
    }

    // Tag eines Datums als "JJJJ-MM-TT".
    function dayKey(text) {
      const t = String(text || '').trim();
      let m = /^(\d{1,2})\.(\d{1,2})\.(\d{4}|\d{2})/.exec(t);
      if (m) {
        let y = Number(m[3]);
        if (m[3].length === 2) y += y <= 69 ? 2000 : 1900;
        return y + '-' + pad2(m[2]) + '-' + pad2(m[1]);
      }
      m = /^(\d{4})-?(\d{2})-?(\d{2})/.exec(t);
      return m ? m[1] + '-' + m[2] + '-' + m[3] : '';
    }

    function todayKey() {
      const d = new Date();
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    }

    // Minute des Tages aus "10:30", "10.30" oder "1030".
    function minuteOf(text) {
      const m = /(\d{1,2})[:.]?(\d{2})/.exec(String(text || '').trim());
      if (!m) return null;
      const h = Number(m[1]);
      const min = Number(m[2]);
      return h < 24 && min < 60 ? h * 60 + min : null;
    }

    function timeOfMinute(minute) {
      return pad2(Math.floor(minute / 60) % 24) + ':' + pad2(minute % 60);
    }

    function timeText(text) {
      const minute = minuteOf(text);
      return minute === null ? '' : timeOfMinute(minute);
    }

    function nowMinute() {
      const d = new Date();
      return d.getHours() * 60 + d.getMinutes();
    }

    function nextQuarterHour() {
      return timeOfMinute((Math.ceil((nowMinute() + 1) / 15) * 15) % (24 * 60));
    }

    // Alter aus dem Geburtsdatum: "8 Monate", "1 Jahr", "7 Jahre".
    function ageText(birth) {
      const key = dayKey(birth);
      if (key === '') return '';
      const [y, m, d] = key.split('-').map(Number);
      const now = new Date();
      const months = (now.getFullYear() - y) * 12 + now.getMonth() + 1 - m - (now.getDate() < d ? 1 : 0);
      if (months < 0) return '';
      if (months < 12) return months === 1 ? '1 Monat' : months + ' Monate';
      const years = Math.floor(months / 12);
      return years === 1 ? '1 Jahr' : years + ' Jahre';
    }

    // ---------------------------------------------------------------------
    //  Felder aus einer Zeile von SoftEngine lesen
    // ---------------------------------------------------------------------
    const ENTITIES = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: ' ', auml: 'ä', ouml: 'ö', uuml: 'ü', Auml: 'Ä', Ouml: 'Ö', Uuml: 'Ü', szlig: 'ß', euro: '€' };

    function decodeEntities(s) {
      if (s.indexOf('&') < 0) return s;
      return s.replace(/&(#x[0-9a-f]+|#[0-9]+|[a-z]+);/gi, function (whole, body) {
        if (body[0] === '#') return String.fromCodePoint(body[1] === 'x' || body[1] === 'X' ? parseInt(body.slice(2), 16) : Number(body.slice(1)));
        return ENTITIES[body] != null ? ENTITIES[body] : whole;
      });
    }

    function cellText(v) {
      if (v == null) return '';
      if (typeof v === 'object') return v.WERT == null || typeof v.WERT === 'object' ? '' : String(v.WERT).trim();
      return String(v).trim();
    }

    // Ein Feld oder das erste von mehreren, das etwas enthält.
    function readField(row, codes) {
      for (const code of [].concat(codes)) {
        const v = readOne(row, code);
        if (v !== '') return v;
      }
      return '';
    }

    // Der Wert steht unter dem Code ("78_30"), mit Vorsatz ("IDB_78_30") oder im ganzen Satz.
    function readOne(row, code) {
      if (!row || typeof row !== 'object' || !code) return '';
      const direct = cellText(row[code]);
      if (direct !== '') return decodeEntities(direct);
      for (const key of Object.keys(row)) {
        if (key.endsWith('_' + code) || key.startsWith(code + '_')) {
          const v = cellText(row[key]);
          if (v !== '') return decodeEntities(v);
        }
      }
      const m = /^(\d+)_(\d+)$/.exec(code);
      const raw = row.SATZNEU != null ? row.SATZNEU : row.SATZ != null ? row.SATZ : row.RAW;
      if (!m || raw == null) return '';
      return decodeEntities(String(raw).substr(Number(m[1]), Number(m[2])).trim());
    }

    function rowsOfEntry(entry) {
      if (Array.isArray(entry)) return entry;
      if (!entry || typeof entry !== 'object') return [];
      const lists = [entry.Zeilen, entry.zeilen, entry.Saetze, entry.saetze, entry.Rows, entry.rows, entry.Daten, entry.daten];
      for (const list of lists) {
        if (Array.isArray(list)) return list;
        if (typeof list === 'string') {
          try { const parsed = JSON.parse(list); if (Array.isArray(parsed)) return parsed; } catch (e) { /* kein JSON */ }
        }
      }
      return [];
    }

    // Die Zeilen des Terminplaners aus dem, was SoftEngine geliefert hat. null: Liste fehlt.
    function terminRows(daten) {
      if (!daten || typeof daten !== 'object') return null;
      const loop = daten.SEFileLoop;
      const entries = Array.isArray(loop) ? loop : loop && typeof loop === 'object'
        ? Object.keys(loop).map(function (key) { const e = loop[key]; return e && typeof e === 'object' && !Array.isArray(e) ? Object.assign({ ALIAS: key }, e) : { ALIAS: key, Zeilen: e }; })
        : [];
      for (const entry of entries) {
        if (entry && (same(entry.ALIAS, CONFIG.quelle) || same(entry.alias, CONFIG.quelle))) return rowsOfEntry(entry);
      }
      for (const key of ['ErpApiCall', 'ERPAPICALL', 'Tabellen']) {
        const block = daten[key];
        if (!block || typeof block !== 'object') continue;
        for (const name of Object.keys(block)) if (same(name, CONFIG.quelle)) return rowsOfEntry(block[name]);
      }
      return null;
    }

    // Alle Codes einer Feldliste, für FELDER einer Abfrage.
    function codesOf(felder) {
      return Object.values(felder).flatMap(function (c) { return [].concat(c); }).filter(Boolean);
    }

    // ---------------------------------------------------------------------
    //  Termine: aus den Zeilen, dazu was gerade geschrieben wird
    // ---------------------------------------------------------------------
    const SPALTEN = ['termin', 'wartezimmer', 'behandlung', 'abrechnung'];

    let beispiel = false;          // true: kein SoftEngine, die Maske zeigt Beispieldaten
    let appointments = [];
    let loadedRows = null;         // null: noch keine Daten
    let searchText = '';

    // Was die Maske geschrieben hat und SoftEngine noch nicht zurückgeliefert hat:
    // so springt ein Termin nicht zurück, bis die frischen Daten da sind.
    const pending = new Map();
    const PENDING_MS = 30000;

    function roomOf(value) {
      const v = String(value || '').trim();
      if (v === '') return null;
      return CONFIG.zimmer.find(function (z) { return same(z.wert, v) || same(z.name, v); }) || null;
    }

    function roomName(value) {
      const room = roomOf(value);
      return room ? room.name : String(value || '').trim();
    }

    // Spalte und Zimmer aus den Feldern Zimmer/Status und Zimmer.
    function placeOf(statusValue, roomValue) {
      const v = String(statusValue || '').trim();
      const s = CONFIG.status;
      const statusRoom = roomOf(v);
      if (statusRoom) return { spalte: 'behandlung', zimmer: statusRoom.name };
      if (v === '') return { spalte: 'termin', zimmer: null };
      for (const key of ['wartezimmer', 'abrechnung', 'fertig']) if (same(v, s[key])) return { spalte: key, zimmer: null };
      if (same(v, s.behandlung)) {
        const name = roomName(roomValue) || (CONFIG.zimmer[0] ? CONFIG.zimmer[0].name : '');
        return { spalte: 'behandlung', zimmer: name };
      }
      return { spalte: 'termin', zimmer: null };
    }

    function appointmentOf(row, i) {
      const f = CONFIG.felder;
      const id = readField(row, f.satz);
      const roomValue = readField(row, f.zimmer);
      const place = placeOf(readField(row, f.status), roomValue);
      const time = timeText(readField(row, f.uhrzeit));
      const changedOn = readField(row, f.geaendertAm);
      const customerNo = readField(row, f.kunde);
      const name = readField(row, f.tiername);
      return {
        id: id !== '' ? id : 'zeile-' + i,
        record: id,
        name: name || 'Ohne Namen',
        kunde: customerNo,
        tierart: readField(row, f.tierart),
        rasse: readField(row, f.rasse),
        alter: ageText(readField(row, f.geburtsdatum)),
        besitzer: [readField(row, f.vorname), readField(row, f.nachname)].filter(Boolean).join(' ') || (customerNo !== '' ? 'Kunde ' + customerNo : ''),
        behandlung: readField(row, f.behandlung),
        notfall: CONFIG.notfall !== '' && same(readField(row, f.prioritaet), CONFIG.notfall),
        spalte: place.spalte,
        zimmer: place.zimmer,
        letztesZimmer: roomName(roomValue),
        uhrzeit: time,
        minute: minuteOf(time),
        seit: changedOn === '' || dayKey(changedOn) === todayKey() ? minuteOf(readField(row, f.geaendertUm)) : null,
        foto: photoOf(customerNo, name),
        // Für den Betrag in der Abrechnung kennt die Maske noch kein Feld; nur die Beispieldaten haben einen.
        betrag: row.BEISPIELBETRAG || '',
      };
    }

    function withPending(a) {
      const own = pending.get(a.id);
      if (!own) return a;
      const arrived = own.spalte === a.spalte && (own.spalte !== 'behandlung' || own.zimmer === a.zimmer);
      if (arrived || Date.now() > own.until) {
        pending.delete(a.id);
        return a;
      }
      return Object.assign({}, a, { spalte: own.spalte, zimmer: own.zimmer, letztesZimmer: own.letztesZimmer, seit: own.seit });
    }

    function byTime(a, b) {
      return (a.minute == null ? 9999 : a.minute) - (b.minute == null ? 9999 : b.minute);
    }

    function takeRows(rows) {
      loadedRows = rows;
      const today = todayKey();
      appointments = rows
        .filter(function (row) { return !CONFIG.nurHeute || dayKey(readField(row, CONFIG.felder.datum)) === today; })
        .map(appointmentOf)
        .map(withPending)
        .filter(function (a) { return a.spalte !== 'fertig'; })
        .sort(byTime);
      render();
      showConnection();
    }

    function dataArrived() {
      const rows = terminRows(window.SEDATA && window.SEDATA.Daten);
      if (rows === null) {
        log('Daten ohne Liste "' + CONFIG.quelle + '"', window.SEDATA);
        if (loadedRows === null) takeRows([]);
      } else {
        takeRows(rows);
      }
      // Beim ersten Mal Kunden und Tiere holen: für Fotos und "Neuer Termin".
      if (lookup.loadedAt === 0) loadLookup();
    }

    // ---------------------------------------------------------------------
    //  Verbindung zu SoftEngine
    // ---------------------------------------------------------------------
    const answerWaiters = [];

    function hasSoftEngine() {
      return typeof window.basisHTML_SND_MSG === 'function';
    }

    function send(verb, message) {
      log('an SoftEngine:', verb, message);
      if (!hasSoftEngine()) return false;
      try {
        window.basisHTML_SND_MSG(verb, message);
        return true;
      } catch (e) {
        console.warn('[Empfang] Senden an SoftEngine gescheitert', e);
        return false;
      }
    }

    function dataOf(payload) {
      let data = payload;
      if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch (e) { return null; }
      }
      return data && typeof data === 'object' && data.Daten && typeof data.Daten === 'object' ? data.Daten : null;
    }

    // Alles, was SoftEngine an die Maske schickt.
    function fromSoftEngine(payload) {
      log('von SoftEngine:', payload);
      const daten = dataOf(payload);
      if (daten) {
        window.SEDATA = window.SEDATA && typeof window.SEDATA === 'object' ? window.SEDATA : {};
        window.SEDATA.Daten = daten;
        dataArrived();
        return;
      }
      // Wie selib: eine Antwort mit RESULT gehört zu einer Relation, eine mit ELEMENTNAME
      // (oder ...LISTE) zu einer Listen-Abfrage; jede geht an die älteste offene Frage ihrer Art.
      const kind = answerKind(payload);
      if (kind === null && answerValue(payload) === undefined) return;
      const waiter = answerWaiters.find(function (w) { return w.kind === (kind || 'relation'); });
      if (waiter) waiter.take(payload);
    }

    function asObject(raw) {
      if (typeof raw !== 'string') return raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : null;
      try { const parsed = JSON.parse(raw); return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : null; } catch (e) { return null; }
    }

    function answerKind(raw) {
      const a = asObject(raw);
      if (!a) return null;
      if ('ELEMENTNAME' in a || Object.keys(a).some(function (k) { return /LISTE$/i.test(k); })) return 'list';
      if ('RESULT' in a || 'result' in a) return 'relation';
      return null;
    }

    // Die Zeilen einer Antwort auf ERPAPICALL: {LISTENNAME, ELEMENTNAME, <Liste>: {<Element>: [...]}}.
    function queryRows(raw) {
      const a = asObject(raw);
      if (!a) return null;
      const isRow = function (v) { return v && typeof v === 'object' && !Array.isArray(v); };
      if (typeof a.LISTENNAME === 'string' && typeof a.ELEMENTNAME === 'string') {
        const named = a[a.LISTENNAME];
        const rows = isRow(named) ? named[a.ELEMENTNAME] : undefined;
        if (Array.isArray(rows)) return rows.filter(isRow);
        return isRow(rows) ? [rows] : [];
      }
      const key = Object.keys(a).find(function (k) { return /LISTE$/i.test(k); });
      if (key === undefined) return null;
      const list = a[key];
      if (Array.isArray(list)) return list.filter(isRow);
      if (!isRow(list)) return [];
      const contents = Object.keys(list).filter(function (k) { return k !== 'SAT' && k !== 'TFELD'; }).map(function (k) { return list[k]; });
      const many = contents.find(Array.isArray);
      if (many) return many.filter(isRow);
      const one = contents.find(isRow);
      return one === undefined ? [] : [one];
    }

    // Eine Liste von SoftEngine holen (ERPAPICALL). null: keine Antwort.
    function askList(id, alias, fields) {
      if (beispiel) return Promise.resolve(sampleList(id));
      return new Promise(function (resolve) {
        let done = false;
        const finish = function (rows) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          const at = answerWaiters.indexOf(waiter);
          if (at >= 0) answerWaiters.splice(at, 1);
          log('Liste ' + id + ':', rows === null ? 'keine Antwort' : rows.length + ' Zeilen');
          resolve(rows);
        };
        const waiter = { kind: 'list', take: function (raw) { finish(queryRows(raw) || []); } };
        answerWaiters.push(waiter);
        const timer = setTimeout(function () { finish(null); }, CONFIG.antwortWarten);
        if (!send('ERPAPICALL', { ID: id, ALIAS: alias, FELDER: fields.join(',') })) finish(null);
      });
    }

    // Der Wert einer Antwort: RESULT, PINDEX, INDEX oder VALUE, sonst der Text selbst.
    function answerValue(raw, depth) {
      depth = depth || 0;
      if (raw == null || depth > 8) return undefined;
      if (typeof raw === 'string') {
        const t = raw.trim();
        if (t === '') return undefined;
        try { const parsed = JSON.parse(t); if (parsed && typeof parsed === 'object') return answerValue(parsed, depth + 1); } catch (e) { /* Text */ }
        return t;
      }
      if (typeof raw === 'number') return String(raw);
      if (Array.isArray(raw)) {
        for (const item of raw) { const v = answerValue(item, depth + 1); if (v !== undefined) return v; }
        return undefined;
      }
      if (typeof raw === 'object') {
        for (const key of ['RESULT', 'result', 'PINDEX', 'pindex', 'INDEX', 'index', 'VALUE', 'value', '0_10']) {
          if (key in raw) { const v = answerValue(raw[key], depth + 1); if (v !== undefined) return v; }
        }
        if (raw.MSG && raw.MSG.DATA !== undefined) return answerValue(raw.MSG.DATA, depth + 1);
      }
      return undefined;
    }

    // Eine Frage an SoftEngine, deren Antwort gebraucht wird (GET_RELATION). Es ist immer nur
    // eine unterwegs, so kann keine Antwort an die falsche Frage gehen. vorne: vor die wartenden.
    const relationQueue = [];
    let relationBusy = false;

    function ask(nr, params, options) {
      const o = options || {};
      return new Promise(function (resolve) {
        const job = { nr: nr, params: params, wait: o.wait || CONFIG.antwortWarten, resolve: resolve };
        if (o.vorne) relationQueue.unshift(job);
        else relationQueue.push(job);
        pumpRelations();
      });
    }

    function pumpRelations() {
      if (relationBusy) return;
      const job = relationQueue.shift();
      if (!job) return;
      relationBusy = true;
      askNow(job.nr, job.params, job.wait).then(function (value) {
        relationBusy = false;
        job.resolve(value);
        pumpRelations();
      });
    }

    function askNow(nr, params, wait) {
      return new Promise(function (resolve) {
        let done = false;
        const seen = new Set(messageKeys());
        const finish = function (value) {
          if (done) return;
          done = true;
          clearInterval(poll);
          clearTimeout(timer);
          const at = answerWaiters.indexOf(waiter);
          if (at >= 0) answerWaiters.splice(at, 1);
          log('Antwort auf Relation ' + nr + ':', value);
          resolve(value);
        };
        const waiter = { kind: 'relation', take: function (raw) { finish(answerValue(raw)); } };
        answerWaiters.push(waiter);
        // Manche SoftEngine-Fassungen legen die Antwort als MessageN in SEDATA ab.
        const poll = setInterval(function () {
          const fresh = messageKeys().filter(function (k) { return !seen.has(k); });
          if (fresh.length > 0) finish(answerValue(window.SEDATA[fresh[fresh.length - 1]]));
        }, 100);
        const timer = setTimeout(function () { finish(undefined); }, wait);
        if (!send('GET_RELATION', { NR: nr, PARAMS: params })) finish(undefined);
      });
    }

    function messageKeys() {
      const se = window.SEDATA;
      return se && typeof se === 'object' ? Object.keys(se).filter(function (k) { return /^Message\d+$/.test(k); }) : [];
    }

    // Ein Feld eines Termins schreiben: PUT_RELATION 174. Die Befehle gehen einer nach dem
    // anderen hinaus, im Abstand von CONFIG.feldSchreiben.abstand.
    const putQueue = [];
    let putBusy = false;

    function writeField(record, code, value) {
      const m = /^(\d+)_(\d+)$/.exec(code);
      if (!m) return false;
      const text = String(value).slice(0, Number(m[2]));
      if (beispiel) return sampleWrite(record, code, text);
      if (!hasSoftEngine()) return false;
      const kind = CONFIG.feldarten[code] || 'L';
      putQueue.push({ NR: CONFIG.feldSchreiben.nr, PARAMS: [m[1], m[2], kind, String(record).trim(), CONFIG.idb, text] });
      pumpPuts();
      return true;
    }

    function pumpPuts() {
      if (putBusy) return;
      const next = putQueue.shift();
      if (!next) {
        if (reloadWanted) scheduleReload();
        return;
      }
      putBusy = true;
      send('PUT_RELATION', next);
      setTimeout(function () { putBusy = false; pumpPuts(); }, CONFIG.feldSchreiben.abstand);
    }

    // Einen neuen Termin anlegen: die Satznummer, sonst null.
    async function createRecord() {
      if (beispiel) return sampleCreate();
      const answer = await ask(CONFIG.satzAnlegen.nr, [CONFIG.idb], { vorne: true });
      const record = String(answer || '').trim();
      if (record === '' || record.length > 10 || /fehler|error|nicht|ungültig/i.test(record)) return null;
      return record;
    }

    // Nach dem Schreiben frische Daten holen, wenn alle Befehle draußen sind.
    let reloadWanted = false;
    let reloadTimer = null;

    function requestFreshData() {
      reloadWanted = true;
      if (!putBusy && putQueue.length === 0) scheduleReload();
    }

    function scheduleReload() {
      reloadWanted = false;
      clearTimeout(reloadTimer);
      if (beispiel) {
        dataArrived();
        return;
      }
      reloadTimer = setTimeout(function () {
        if (typeof window.ReloadInputJSON !== 'function') return;
        try { window.ReloadInputJSON(); log('frische Daten angefordert'); } catch (e) { console.warn('[Empfang] ReloadInputJSON gescheitert', e); }
      }, 400);
    }

    function connect() {
      try { if (window.selib && window.selib.Json && window.selib.Json.InitializeERPConnection) window.selib.Json.InitializeERPConnection(); } catch (e) { /* nicht da */ }
      try { if (typeof window.InitialisiereSchnittstelle === 'function') window.InitialisiereSchnittstelle(); } catch (e) { /* nicht da */ }
      if (PROTOKOLL && typeof window.basisHTML_SetConsoleLog === 'function') window.basisHTML_SetConsoleLog(true, true);

      // SoftEngine ruft diese Namen auf, wenn SEDATA gefüllt ist.
      window.Erstellen = dataArrived;
      window.initData = dataArrived;
      window.ReloadData = dataArrived;

      let tries = 0;
      (function register() {
        if (typeof window.basisHTML_REGISTER === 'function') {
          try { window.basisHTML_REGISTER(fromSoftEngine, document.title, '1.0'); return; } catch (e) { console.warn('[Empfang] Anmelden bei SoftEngine gescheitert', e); }
        }
        if (++tries < 400) setTimeout(register, 25);
      })();

      // Steht SEDATA schon da, ohne dass jemand Bescheid sagt: selbst nachsehen.
      let looks = 0;
      const look = setInterval(function () {
        looks++;
        if (window.SEDATA && window.SEDATA.Daten && loadedRows === null) dataArrived();
        if (loadedRows !== null || looks > 100) clearInterval(look);
      }, 300);

      // Was andere Plätze ändern, kommt mit dem regelmäßigen Neuladen.
      if (CONFIG.neuLaden > 0) {
        setInterval(function () {
          if (putBusy || putQueue.length > 0 || dragId !== null) return;
          scheduleReload();
        }, CONFIG.neuLaden * 1000);
      }
    }

    // ---------------------------------------------------------------------
    //  Beispielbetrieb: ohne SoftEngine schreibt die Maske in die Beispielzeilen
    // ---------------------------------------------------------------------
    const sample = { rows: [] };

    function sampleRows() {
      const f = CONFIG.felder;
      const now = nowMinute();
      const customers = new Map(BEISPIEL.kunden.map(function (k) { return [k[0], k]; }));
      const pets = new Map(BEISPIEL.tiere.map(function (t) { return [t[0], t]; }));
      return BEISPIEL.termine.map(function (t, i) {
        const pet = pets.get(t[0]);
        const customer = customers.get(pet[1]);
        const time = Math.max(0, Math.min(23 * 60 + 55, Math.round((now + t[1]) / 5) * 5));
        const row = {};
        row[f.satz] = String(i + 1);
        row[f.kunde] = customer[0];
        row[f.vorname] = customer[1];
        row[f.nachname] = customer[2];
        row[f.tiername] = pet[2];
        row[f.tierart] = pet[3];
        row[f.rasse] = pet[4];
        row[f.geburtsdatum] = pet[5];
        row[f.uhrzeit] = timeOfMinute(time);
        row[f.datum] = todayText();
        row[f.behandlung] = t[4];
        row[f.status] = CONFIG.status[t[2]];
        row[f.prioritaet] = t[5] ? CONFIG.notfall : '';
        row[f.zimmer] = t[6];
        row[f.geaendertAm] = todayText();
        row[f.geaendertUm] = timeOfMinute(Math.max(0, now - t[3]));
        row.BEISPIELBETRAG = t[7] || '';
        return row;
      });
    }

    function sampleList(id) {
      const first = function (codes) { return [].concat(codes)[0]; };
      if (id === CONFIG.kunden.abfrage) {
        const f = CONFIG.kunden.felder;
        return BEISPIEL.kunden.map(function (k) {
          const row = {};
          row[f.nummer] = k[0];
          row[f.vorname] = k[1];
          row[f.nachname] = k[2];
          row[f.ort] = k[3];
          return row;
        });
      }
      if (id === CONFIG.tiere.abfrage) {
        const f = CONFIG.tiere.felder;
        return BEISPIEL.tiere.map(function (t) {
          const row = { BEISPIELFOTO: t[6] };
          row[first(f.nummer)] = t[0];
          row[first(f.kunde)] = t[1];
          row[first(f.tiername)] = t[2];
          row[first(f.tierart)] = t[3];
          row[first(f.rasse)] = t[4];
          row[first(f.geburtsdatum)] = t[5];
          return row;
        });
      }
      return [];
    }

    // SoftEngine setzt "Geändert am/um" beim Schreiben, so nimmt es die Maske an; das Beispiel tut es auch.
    function sampleWrite(record, code, value) {
      const f = CONFIG.felder;
      const row = sample.rows.find(function (r) { return same(r[f.satz], record); });
      if (!row) return false;
      row[code] = value;
      row[f.geaendertAm] = todayText();
      row[f.geaendertUm] = timeOfMinute(nowMinute());
      return true;
    }

    function sampleCreate() {
      const f = CONFIG.felder;
      const record = String(sample.rows.reduce(function (max, r) { return Math.max(max, Number(r[f.satz]) || 0); }, 0) + 1);
      const row = {};
      row[f.satz] = record;
      sample.rows.push(row);
      return record;
    }

    // ---------------------------------------------------------------------
    //  Kunden und Tiere: für die Fotos und für "Neuer Termin"
    // ---------------------------------------------------------------------
    const lookup = {
      customers: null,             // null: noch nicht geladen
      pets: null,
      petByKey: new Map(),         // Kundennummer|Tiername -> Tier
      loading: null,
      loadedAt: 0,
    };

    function petKey(customerNo, name) {
      return plainNumber(customerNo) + '|' + plain(name);
    }

    function customerOf(row) {
      const f = CONFIG.kunden.felder;
      const c = { nummer: readField(row, f.nummer), vorname: readField(row, f.vorname), nachname: readField(row, f.nachname), ort: readField(row, f.ort) };
      c.anzeige = [c.vorname, c.nachname].filter(Boolean).join(' ');
      c.suche = plain([c.nummer, c.vorname, c.nachname, c.ort].join(' '));
      return c;
    }

    function petOf(row) {
      const f = CONFIG.tiere.felder;
      return {
        nummer: readField(row, f.nummer),
        kunde: readField(row, f.kunde),
        name: readField(row, f.tiername),
        art: readField(row, f.tierart),
        rasse: readField(row, f.rasse),
        geburtsdatum: readField(row, f.geburtsdatum),
        medien: readField(row, f.medien),
        beispielfoto: row.BEISPIELFOTO || '',
      };
    }

    // Kunden und Tiere einmal laden, nacheinander; danach zeigt die Tafel die Fotos.
    function loadLookup() {
      if (lookup.loading) return lookup.loading;
      lookup.loading = (async function () {
        const k = CONFIG.kunden;
        const t = CONFIG.tiere;
        const customers = await askList(k.abfrage, 'Kunden', codesOf(k.felder));
        const pets = await askList(t.abfrage, 'Tiere', codesOf(t.felder));
        if (customers) lookup.customers = customers.map(customerOf).filter(function (c) { return c.anzeige !== ''; });
        if (pets) {
          lookup.pets = pets.map(petOf).filter(function (p) { return p.name !== ''; });
          lookup.petByKey = new Map(lookup.pets.map(function (p) { return [petKey(p.kunde, p.name), p]; }));
        }
        lookup.loadedAt = Date.now();
        lookup.loading = null;
        fillSpeciesLists();
        if (loadedRows !== null) takeRows(loadedRows);
      })();
      return lookup.loading;
    }

    // Das Foto kommt vom Tier: aus den Beispielfotos oder über seine Medien-Nummer von SoftEngine.
    const petPhotos = new Map();

    function photoOf(customerNo, name) {
      const pet = lookup.petByKey.get(petKey(customerNo, name));
      if (!pet) return null;
      if (beispiel) return (BEISPIEL_FOTOS && BEISPIEL_FOTOS[pet.beispielfoto]) || null;
      const number = plainNumber(pet.medien);
      if (!/^\d+$/.test(number)) return null;
      if (petPhotos.has(number)) return petPhotos.get(number) || null;
      petPhotos.set(number, '');
      const t = CONFIG.tierfoto;
      ask(t.nr, [pet.medien, t.zusatz], { wait: t.warten }).then(function (answer) {
        const url = photoAddress(answer);
        if (!url) return;
        petPhotos.set(number, url);
        if (loadedRows !== null) takeRows(loadedRows);
      });
      return null;
    }

    // Was Relation 1912 liefert: eine Adresse, ein Dateipfad oder das Bild selbst (Base64).
    function photoAddress(answer) {
      const v = String(answer || '').trim();
      if (v === '') return '';
      if (/^(https?:|data:image\/|file:)/i.test(v)) return v;
      if (/^[a-z]:[\\/]/i.test(v) || v.indexOf('\\\\') === 0) return 'file:///' + v.replace(/\\/g, '/');
      if (v.length > 200 && /^[A-Za-z0-9+/=\s]+$/.test(v)) return 'data:image/jpeg;base64,' + v.replace(/\s/g, '');
      return '';
    }

    // ---------------------------------------------------------------------
    //  Die Tafel zeichnen
    // ---------------------------------------------------------------------
    const tafel = document.getElementById('tafel');
    let renderLater = false;
    let dragId = null;

    function minutesSince(a) {
      return a.seit === null ? null : Math.max(0, nowMinute() - a.seit);
    }

    function waitTone(minutes) {
      if (minutes === null) return '';
      return minutes >= CONFIG.wartezeit.dringend ? 'dringend' : minutes >= CONFIG.wartezeit.warnen ? 'warnen' : '';
    }

    function isLate(a) {
      return a.minute !== null && nowMinute() - a.minute > CONFIG.verspaetet;
    }

    function matchesSearch(a) {
      if (searchText === '') return true;
      const text = plain([a.name, a.besitzer, a.behandlung, a.tierart, a.rasse].join(' '));
      return searchText.split(/\s+/).map(plain).every(function (word) { return text.includes(word); });
    }

    // Die Marke oben rechts: Uhrzeit, Wartezeit, Minuten im Zimmer oder Betrag.
    function valueOf(a) {
      if (a.spalte === 'termin') return { text: a.uhrzeit, ton: isLate(a) ? 'warnen' : '' };
      if (a.spalte === 'abrechnung' && a.betrag) return { text: a.betrag, ton: '' };
      const minutes = minutesSince(a);
      if (minutes === null) return { text: a.uhrzeit, ton: '' };
      return { text: minutes + ' min', ton: a.spalte === 'wartezimmer' ? waitTone(minutes) : '' };
    }

    // Die eine Aktion im Fuß der Karte, je Spalte.
    const AKTIONEN = { termin: 'Ins Wartezimmer', wartezimmer: 'Aufrufen', behandlung: 'Zur Abrechnung', abrechnung: 'Kassieren' };

    // Ohne Foto zwei Initialen: aus zwei Wörtern je der erste Buchstabe, sonst die ersten zwei.
    function initials(name) {
      const words = String(name || '').trim().split(/\s+/).filter(Boolean);
      const text = words.length > 1 ? words[0].charAt(0) + words[1].charAt(0) : (words[0] || '').slice(0, 2);
      return text.toUpperCase();
    }

    function photoHtml(a) {
      if (a.foto) return '<img class="foto" src="' + esc(a.foto) + '" alt="">';
      return '<span class="foto" aria-hidden="true">' + esc(initials(a.name)) + '</span>';
    }

    function cardHtml(a) {
      const value = valueOf(a);
      const kind = a.rasse || a.tierart;
      const origin = a.spalte === 'abrechnung' && a.letztesZimmer ? 'Aus ' + a.letztesZimmer : '';
      const reason = (a.notfall ? '<span class="dringend">Notfall</span> ' : '') + esc(a.behandlung);
      return '<article class="karte" tabindex="0" draggable="true" aria-haspopup="menu" data-id="' + esc(a.id) + '">'
        + '<div class="karte-kopf">'
        + photoHtml(a)
        + '<div>'
        + '<p class="karte-name">' + esc(a.name) + (kind ? '<span class="karte-art">' + esc(kind) + '</span>' : '') + '</p>'
        + (a.besitzer ? '<p class="karte-besitzer">' + esc(a.besitzer) + '</p>' : '')
        + '</div>'
        + (value.text ? '<span class="marke ' + value.ton + '">' + esc(value.text) + '</span>' : '')
        + '</div>'
        + (reason ? '<p class="karte-grund">' + reason + '</p>' : '')
        + '<div class="karte-fuss">'
        + '<span>' + esc(origin) + '</span>'
        + '<button class="knopf knopf-klein knopf-weich" type="button" tabindex="-1" data-aktion>' + AKTIONEN[a.spalte] + '</button>'
        + '</div>'
        + '</article>';
    }

    // Die eingestellten Zimmer, dazu jedes unbekannte, in dem gerade jemand ist.
    function roomsOf(list) {
      const rooms = CONFIG.zimmer.slice();
      list.forEach(function (a) {
        if (a.zimmer && !rooms.some(function (z) { return z.name === a.zimmer; })) rooms.push({ name: a.zimmer, wert: a.zimmer, zusatz: '' });
      });
      return rooms;
    }

    function treatmentHtml(all, shown) {
      return roomsOf(all).map(function (room) {
        const busy = all.some(function (a) { return a.zimmer === room.name; });
        const cards = shown.filter(function (a) { return a.zimmer === room.name; }).map(cardHtml).join('');
        return '<section class="zimmer" data-ziel="behandlung" data-zimmer="' + esc(room.name) + '">'
          + '<header class="zimmer-kopf"><h3>' + esc(room.name)
          + (room.zusatz ? '<span class="zimmer-zusatz">' + esc(room.zusatz) + '</span>' : '') + '</h3>'
          + '<span class="zimmer-stand">' + (busy ? 'Belegt' : 'Frei') + '</span></header>'
          + (cards || '<div class="zimmer-leer"></div>')
          + '</section>';
      }).join('');
    }

    function freeRooms(all) {
      return roomsOf(all).filter(function (room) { return !all.some(function (a) { return a.zimmer === room.name; }); });
    }

    function render() {
      if (dragId !== null || menu.forId !== null) {
        renderLater = true;
        return;
      }
      renderLater = false;
      const focused = document.activeElement && document.activeElement.classList.contains('karte') ? document.activeElement.dataset.id : null;
      const count = {};
      SPALTEN.forEach(function (spalte) {
        const all = appointments.filter(function (a) { return a.spalte === spalte; });
        const shown = all.filter(matchesSearch);
        count[spalte] = all;
        document.getElementById('inhalt-' + spalte).innerHTML = spalte === 'behandlung' ? treatmentHtml(all, shown) : shown.map(cardHtml).join('');
        document.getElementById('zahl-' + spalte).textContent = String(all.length);
      });
      const rooms = roomsOf(count.behandlung);
      document.getElementById('kennzahl-termin').textContent = String(count.termin.length);
      document.getElementById('kennzahl-wartezimmer').textContent = String(count.wartezimmer.length);
      document.getElementById('kennzahl-zimmer').textContent = (rooms.length - freeRooms(count.behandlung).length) + ' / ' + rooms.length;
      document.getElementById('kennzahl-abrechnung').textContent = String(count.abrechnung.length);
      if (focused !== null) {
        const card = cardOf(focused);
        if (card) card.focus();
      }
    }

    function cardOf(id) {
      return tafel.querySelector('.karte[data-id="' + CSS.escape(id) + '"]');
    }

    function appointmentById(id) {
      return appointments.find(function (a) { return a.id === id; }) || null;
    }

    function showConnection() {
      const el = document.getElementById('verbindung');
      if (beispiel) {
        el.className = '';
        el.textContent = 'Beispieldaten';
      } else if (loadedRows === null) {
        el.className = 'warnen';
        el.textContent = 'Warte auf SoftEngine';
      } else {
        el.textContent = '';
      }
    }

    function showClock() {
      document.getElementById('uhr').textContent = timeOfMinute(nowMinute());
      document.getElementById('datum').textContent = new Date().toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
    }

    // ---------------------------------------------------------------------
    //  Verschieben: Aktion der Karte, Menü oder Ziehen
    // ---------------------------------------------------------------------
    function moveTo(id, target) {
      const a = appointments.find(function (item) { return item.id === id; });
      if (!a) return;
      if (target.spalte === 'fertig') {
        checkout(a);
        return;
      }
      if (target.spalte === 'behandlung' && !target.zimmer) {
        const free = freeRooms(appointments.filter(function (item) { return item.spalte === 'behandlung'; }));
        target = { spalte: 'behandlung', zimmer: free.length > 0 ? free[0].name : CONFIG.zimmer[0].name };
      }
      if (a.spalte === target.spalte && (target.spalte !== 'behandlung' || a.zimmer === target.zimmer)) return;
      if (a.record === '') {
        showError(a.name + ': Satznummer fehlt, nicht gespeichert');
        return;
      }
      if (!writeField(a.record, CONFIG.felder.status, CONFIG.status[target.spalte])) {
        showError('Keine Verbindung zu SoftEngine, nicht gespeichert');
        return;
      }
      // Das Zimmer bleibt im Feld stehen, für "Zimmer 2" in der Abrechnung.
      if (target.spalte === 'behandlung') {
        const room = roomOf(target.zimmer);
        writeField(a.record, CONFIG.felder.zimmer, room ? room.wert : target.zimmer);
      }
      a.spalte = target.spalte;
      a.zimmer = target.spalte === 'behandlung' ? target.zimmer : null;
      a.letztesZimmer = a.zimmer || a.letztesZimmer;
      a.seit = nowMinute();
      pending.set(a.id, { spalte: a.spalte, zimmer: a.zimmer, letztesZimmer: a.letztesZimmer, seit: a.seit, until: Date.now() + PENDING_MS });
      render();
      requestFreshData();
    }

    function checkout(a) {
      if (a.record === '' || !writeField(a.record, CONFIG.felder.status, CONFIG.status.fertig)) {
        showError('Keine Verbindung zu SoftEngine, nicht gespeichert');
        return;
      }
      if (CONFIG.kassenWerkzeug !== '') send('START_TOOL', { NR: CONFIG.kassenWerkzeug });
      pending.set(a.id, { spalte: 'fertig', zimmer: null, letztesZimmer: a.letztesZimmer, seit: nowMinute(), until: Date.now() + PENDING_MS });
      appointments = appointments.filter(function (item) { return item.id !== a.id; });
      render();
      requestFreshData();
    }

    // Wohin ein Termin gehen kann, in der Reihenfolge des Ablaufs; next ist der übliche nächste Schritt.
    function targetsOf(a) {
      const all = appointments.filter(function (item) { return item.spalte === 'behandlung'; });
      const free = freeRooms(all);
      const targets = [];
      if (a.spalte !== 'termin') targets.push({ spalte: 'termin', text: 'Nicht zugewiesen' });
      if (a.spalte !== 'wartezimmer') targets.push({ spalte: 'wartezimmer', text: 'Wartezimmer', next: a.spalte === 'termin' });
      roomsOf(all).forEach(function (room) {
        if (a.spalte === 'behandlung' && a.zimmer === room.name) return;
        const inside = all.filter(function (item) { return item.zimmer === room.name; }).map(function (item) { return item.name; });
        targets.push({
          spalte: 'behandlung',
          zimmer: room.name,
          text: room.name,
          zusatz: inside.length > 0 ? inside.join(', ') : 'Frei',
          ton: inside.length > 0 ? 'leise' : 'neben',
          next: a.spalte === 'wartezimmer' && free.length > 0 && free[0].name === room.name,
        });
      });
      if (a.spalte !== 'abrechnung') targets.push({ spalte: 'abrechnung', text: 'Abrechnung', next: a.spalte === 'behandlung' });
      if (a.spalte === 'abrechnung') targets.push({ spalte: 'fertig', text: 'Kassieren', next: true });
      return targets;
    }

    const menuEl = document.getElementById('menue');
    const menu = { forId: null, targets: [] };

    // Das Menü einer Karte: alle Ziele, oder beim Aufrufen nur die Zimmer.
    function openMenu(row, point, onlyRooms) {
      const a = appointmentById(row.dataset.id);
      if (!a) return;
      closeMenu(false);
      menu.forId = a.id;
      menu.targets = targetsOf(a).filter(function (t) { return !onlyRooms || t.spalte === 'behandlung'; });
      menuEl.innerHTML = '<p class="menue-titel">' + esc(a.name) + '</p>' + menu.targets.map(function (t, i) {
        return '<button class="menue-eintrag' + (t.next ? ' standard' : '') + '" type="button" role="menuitem" data-i="' + i + '">'
          + '<span>' + esc(t.text) + '</span>'
          + (t.zusatz ? '<span class="' + t.ton + '">' + esc(t.zusatz) + '</span>' : '')
          + '</button>';
      }).join('');
      row.classList.add('offen');
      menuEl.hidden = false;
      const box = row.getBoundingClientRect();
      const width = menuEl.offsetWidth;
      const height = menuEl.offsetHeight;
      const left = point ? point.x : box.left + box.width / 2;
      let top = point ? point.y : box.bottom;
      if (top + height > window.innerHeight - 8) top = Math.max(8, (point ? point.y : box.top) - height);
      menuEl.style.left = Math.max(8, Math.min(left, window.innerWidth - width - 8)) + 'px';
      menuEl.style.top = top + 'px';
      const next = menu.targets.findIndex(function (t) { return t.next; });
      menuEl.querySelectorAll('.menue-eintrag')[Math.max(0, next)].focus();
    }

    function closeMenu(refocus) {
      if (menu.forId === null) return;
      const id = menu.forId;
      menu.forId = null;
      menuEl.hidden = true;
      menuEl.innerHTML = '';
      const row = cardOf(id);
      if (row) {
        row.classList.remove('offen');
        if (refocus) row.focus();
      }
      if (renderLater) render();
    }

    menuEl.addEventListener('click', function (e) {
      const item = e.target.closest('.menue-eintrag');
      if (!item) return;
      const id = menu.forId;
      const target = menu.targets[Number(item.dataset.i)];
      closeMenu(true);
      moveTo(id, target);
    });

    menuEl.addEventListener('keydown', function (e) {
      const items = Array.from(menuEl.querySelectorAll('.menue-eintrag'));
      const at = items.indexOf(document.activeElement);
      if (e.key === 'Escape') {
        e.preventDefault();
        closeMenu(true);
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        items[(at + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length].focus();
      } else if (e.key === 'Home' || e.key === 'End') {
        e.preventDefault();
        items[e.key === 'Home' ? 0 : items.length - 1].focus();
      } else if (e.key === 'Tab') {
        e.preventDefault();
        closeMenu(true);
      }
    });

    document.addEventListener('mousedown', function (e) {
      if (menu.forId !== null && !menuEl.contains(e.target)) closeMenu(false);
    }, true);
    window.addEventListener('resize', function () { closeMenu(false); });
    tafel.addEventListener('scroll', function () { closeMenu(false); }, true);

    // Die Aktion im Fuß führt den nächsten Schritt aus; ein Klick sonst auf die Karte öffnet das Menü.
    const NAECHSTE = { termin: 'wartezimmer', behandlung: 'abrechnung', abrechnung: 'fertig' };

    tafel.addEventListener('click', function (e) {
      const card = e.target.closest('.karte');
      if (!card) return;
      const button = e.target.closest('[data-aktion]');
      const a = appointmentById(card.dataset.id);
      if (!button || !a) {
        openMenu(card, { x: e.clientX, y: e.clientY });
      } else if (a.spalte === 'wartezimmer') {
        const box = button.getBoundingClientRect();
        openMenu(card, { x: box.left, y: box.bottom + 4 }, true);
      } else {
        moveTo(a.id, { spalte: NAECHSTE[a.spalte] });
      }
    });

    tafel.addEventListener('contextmenu', function (e) {
      const row = e.target.closest('.karte');
      if (!row) return;
      e.preventDefault();
      openMenu(row, { x: e.clientX, y: e.clientY });
    });

    // Tastatur: Enter öffnet das Menü, die Pfeiltasten gehen von Zeile zu Zeile und von Spalte zu Spalte.
    tafel.addEventListener('keydown', function (e) {
      const row = e.target.closest('.karte');
      if (!row || e.target !== row) return;
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'ContextMenu') {
        e.preventDefault();
        openMenu(row, null);
        return;
      }
      if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
      e.preventDefault();
      const lanes = SPALTEN.map(function (spalte) { return Array.from(document.getElementById('inhalt-' + spalte).querySelectorAll('.karte')); });
      const lane = lanes.findIndex(function (rows) { return rows.includes(row); });
      const index = lanes[lane].indexOf(row);
      let next = null;
      if (e.key === 'ArrowUp') next = lanes[lane][index - 1];
      else if (e.key === 'ArrowDown') next = lanes[lane][index + 1];
      else {
        const step = e.key === 'ArrowLeft' ? -1 : 1;
        for (let l = lane + step; l >= 0 && l < lanes.length && !next; l += step) {
          if (lanes[l].length > 0) next = lanes[l][Math.min(index, lanes[l].length - 1)];
        }
      }
      if (next) next.focus();
    });

    // Ziehen und Ablegen: auf eine Spalte oder ein Zimmer.
    function dropZone(el) {
      return el && el.closest ? el.closest('[data-ziel]') : null;
    }

    function clearZones() {
      tafel.querySelectorAll('.ziel').forEach(function (el) { el.classList.remove('ziel'); });
    }

    tafel.addEventListener('dragstart', function (e) {
      const row = e.target.closest('.karte');
      if (!row) return;
      closeMenu(false);
      dragId = row.dataset.id;
      row.classList.add('gezogen');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', dragId);
    });

    tafel.addEventListener('dragend', function () {
      dragId = null;
      clearZones();
      tafel.querySelectorAll('.gezogen').forEach(function (el) { el.classList.remove('gezogen'); });
      if (renderLater) render();
    });

    tafel.addEventListener('dragover', function (e) {
      const zone = dropZone(e.target);
      if (dragId === null || !zone) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (!zone.classList.contains('ziel')) {
        clearZones();
        zone.classList.add('ziel');
      }
    });

    tafel.addEventListener('dragleave', function (e) {
      const zone = dropZone(e.target);
      if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove('ziel');
    });

    tafel.addEventListener('drop', function (e) {
      const zone = dropZone(e.target);
      if (dragId === null || !zone) return;
      e.preventDefault();
      const id = dragId;
      dragId = null;
      clearZones();
      moveTo(id, { spalte: zone.dataset.ziel, zimmer: zone.dataset.zimmer || null });
    });

    // ---------------------------------------------------------------------
    //  Termin anlegen: die Lade von rechts über der Tafel
    // ---------------------------------------------------------------------
    const drawer = document.getElementById('lade');
    const ownerInput = document.getElementById('besitzer');
    const ownerList = document.getElementById('besitzerListe');
    const form = { customer: null, hits: [], active: -1, creating: false };

    function resetForm() {
      document.getElementById('formular').reset();
      document.getElementById('formFehler').hidden = true;
      form.customer = null;
      document.getElementById('uhrzeit').value = nextQuarterHour();
      showHits([]);
      showPets();
    }

    // Escape schließt die Lade von selbst, ein Klick neben sie auch.
    function openDrawer() {
      closeMenu(false);
      resetForm();
      drawer.showModal();
      ownerInput.focus();
      if (lookup.customers === null) loadLookup();
    }

    drawer.addEventListener('click', function (e) {
      if (e.target === drawer) drawer.close();
    });

    function customerHits(text) {
      const words = text.trim().split(/\s+/).map(plain).filter(Boolean);
      if (!lookup.customers || words.length === 0) return [];
      return lookup.customers
        .filter(function (c) { return words.every(function (w) { return c.suche.includes(w); }); })
        .sort(function (a, b) { return a.nachname.localeCompare(b.nachname, 'de') || a.vorname.localeCompare(b.vorname, 'de'); })
        .slice(0, 8);
    }

    function showHits(hits) {
      form.hits = hits;
      form.active = hits.length > 0 ? 0 : -1;
      ownerList.innerHTML = hits.map(function (c, i) {
        return '<li class="vorschlag" role="option" id="vorschlag-' + i + '" data-i="' + i + '" aria-selected="' + (i === form.active) + '">'
          + '<span>' + esc(c.anzeige) + '</span><span class="leise">' + esc([c.nummer, c.ort].filter(Boolean).join(', ')) + '</span></li>';
      }).join('');
      ownerList.hidden = hits.length === 0;
      ownerInput.setAttribute('aria-expanded', String(hits.length > 0));
      markActive();
    }

    function markActive() {
      ownerList.querySelectorAll('.vorschlag').forEach(function (li, i) { li.setAttribute('aria-selected', String(i === form.active)); });
      if (form.active >= 0) ownerInput.setAttribute('aria-activedescendant', 'vorschlag-' + form.active);
      else ownerInput.removeAttribute('aria-activedescendant');
    }

    function chooseCustomer(c) {
      form.customer = c;
      ownerInput.value = c.anzeige;
      showHits([]);
      showPets();
    }

    function petsOf(customer) {
      if (!customer || !lookup.pets) return [];
      return lookup.pets
        .filter(function (p) { return plainNumber(p.kunde) === plainNumber(customer.nummer); })
        .sort(function (a, b) { return a.name.localeCompare(b.name, 'de'); });
    }

    // Die Tiere des gewählten Kunden zum Ankreuzen; ein neues Tier ohne Kunden oder auf Wunsch.
    function showPets() {
      const pets = petsOf(form.customer);
      const list = document.getElementById('tierListe');
      list.innerHTML = pets.map(function (p, i) {
        const kind = [p.rasse || p.art, ageText(p.geburtsdatum)].filter(Boolean).join(', ');
        return '<label class="wahl"><input type="checkbox" name="tier" value="' + i + '"' + (pets.length === 1 ? ' checked' : '') + '>'
          + '<span>' + esc(p.name) + (kind ? ' <span class="leise">' + esc(kind) + '</span>' : '') + '</span></label>';
      }).join('') + (pets.length > 0 ? '<label class="wahl"><input type="checkbox" id="neuesTierWahl">Neues Tier</label>' : '');
      list.hidden = pets.length === 0;
      form.pets = pets;
      showNewPet();
    }

    function wantsNewPet() {
      const choice = document.getElementById('neuesTierWahl');
      return choice ? choice.checked : true;
    }

    function showNewPet() {
      document.getElementById('neuesTier').hidden = !wantsNewPet();
    }

    function fillSpeciesLists() {
      const pets = lookup.pets || [];
      const options = function (values) {
        return Array.from(new Set(values.filter(Boolean))).sort(function (a, b) { return a.localeCompare(b, 'de'); })
          .map(function (v) { return '<option value="' + esc(v) + '">'; }).join('');
      };
      document.getElementById('tierarten').innerHTML = options(pets.map(function (p) { return p.art; }));
      document.getElementById('rassen').innerHTML = options(pets.map(function (p) { return p.rasse; }));
    }

    // Ein Name ohne Kunden: "Nachname, Vorname" oder "Vorname Nachname".
    function splitName(text) {
      const t = text.trim();
      if (t.includes(',')) {
        const parts = t.split(',');
        return { vorname: parts.slice(1).join(',').trim(), nachname: parts[0].trim() };
      }
      const words = t.split(/\s+/);
      return { vorname: words.slice(0, -1).join(' '), nachname: words[words.length - 1] || '' };
    }

    ownerInput.addEventListener('input', function () {
      form.customer = null;
      showHits(customerHits(ownerInput.value));
      showPets();
    });

    ownerInput.addEventListener('keydown', function (e) {
      if (ownerList.hidden) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        form.active = (form.active + (e.key === 'ArrowDown' ? 1 : form.hits.length - 1)) % form.hits.length;
        markActive();
      } else if (e.key === 'Enter' && form.active >= 0) {
        e.preventDefault();
        chooseCustomer(form.hits[form.active]);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        showHits([]);
      }
    });

    ownerList.addEventListener('mousedown', function (e) {
      const li = e.target.closest('.vorschlag');
      if (!li) return;
      e.preventDefault();
      chooseCustomer(form.hits[Number(li.dataset.i)]);
    });

    document.getElementById('tierListe').addEventListener('change', function (e) {
      if (e.target.id === 'neuesTierWahl') {
        showNewPet();
        if (e.target.checked) document.getElementById('tierName').focus();
      }
    });

    document.getElementById('schliessen').addEventListener('click', function () { drawer.close(); });

    document.getElementById('formular').addEventListener('submit', async function (e) {
      e.preventDefault();
      if (form.creating) return;
      const ownerText = ownerInput.value.trim();
      const chosen = Array.from(document.querySelectorAll('input[name="tier"]:checked')).map(function (box) { return form.pets[Number(box.value)]; });
      const fresh = wantsNewPet()
        ? { name: document.getElementById('tierName').value.trim(), art: document.getElementById('tierArt').value.trim(), rasse: document.getElementById('tierRasse').value.trim(), geburtsdatum: '' }
        : null;
      if (ownerText === '') {
        showError('Besitzer fehlt');
        ownerInput.focus();
        return;
      }
      if (fresh && fresh.name === '') {
        showError('Name des Tiers fehlt');
        document.getElementById('tierName').focus();
        return;
      }
      const pets = chosen.concat(fresh ? [fresh] : []);
      if (pets.length === 0) {
        showError('Kein Tier gewählt');
        return;
      }
      if (!beispiel && !hasSoftEngine()) {
        showError('Keine Verbindung zu SoftEngine, Termin nicht angelegt');
        return;
      }
      const customer = form.customer;
      const names = customer ? { vorname: customer.vorname, nachname: customer.nachname } : splitName(ownerText);
      const spalte = document.querySelector('input[name="wohin"]:checked').value;
      const time = document.getElementById('uhrzeit').value || nextQuarterHour();
      const reason = document.getElementById('behandlung').value.trim();
      const urgent = document.getElementById('notfall').checked;
      const f = CONFIG.felder;

      setCreating(true);
      let made = 0;
      for (const pet of pets) {
        const record = await createRecord();
        if (record === null) {
          showError('Termin nicht angelegt: keine Satznummer von SoftEngine');
          break;
        }
        [
          [f.kunde, customer ? customer.nummer : ''],
          [f.vorname, names.vorname],
          [f.nachname, names.nachname],
          [f.tiername, pet.name],
          [f.tierart, pet.art],
          [f.rasse, pet.rasse],
          [f.geburtsdatum, pet.geburtsdatum],
          [f.datum, todayText()],
          [f.uhrzeit, time],
          [f.behandlung, reason],
          [f.status, CONFIG.status[spalte]],
          [f.prioritaet, urgent ? CONFIG.notfall : ''],
        ].forEach(function (pair) { if (pair[1] !== '') writeField(record, pair[0], pair[1]); });
        made++;
      }
      setCreating(false);
      if (made === 0) return;
      drawer.close();
      requestFreshData();
    });

    function setCreating(on) {
      form.creating = on;
      const button = document.getElementById('anlegen');
      button.disabled = on;
      button.textContent = on ? 'Wird eingetragen' : 'Eintragen';
    }

    // ---------------------------------------------------------------------
    //  Fehler melden und Start
    // ---------------------------------------------------------------------
    // Gemeldet wird nur, was schiefging: in der offenen Lade über "Eintragen",
    // sonst eine Zeile unten, nach fünf Sekunden weg.
    function showError(text) {
      if (drawer.open) {
        const line = document.getElementById('formFehler');
        line.textContent = text;
        line.hidden = false;
        return;
      }
      const el = document.createElement('div');
      el.className = 'meldung';
      el.textContent = text;
      document.getElementById('meldungen').appendChild(el);
      setTimeout(function () {
        el.classList.add('weg');
        setTimeout(function () { el.remove(); }, 300);
      }, 5000);
    }

    document.getElementById('suche').addEventListener('input', function (e) {
      searchText = e.target.value.trim();
      render();
    });

    document.getElementById('terminAnlegen').addEventListener('click', openDrawer);

    window.addEventListener('load', function () {
      beispiel = !hasSoftEngine() && typeof window.basisHTML_REGISTER !== 'function' && !(window.SEDATA && window.SEDATA.Daten);
      document.getElementById('praxis').textContent = CONFIG.praxis;
      showClock();
      showConnection();
      if (beispiel) {
        sample.rows = sampleRows();
        window.SEDATA = { Daten: { SEFileLoop: [{ ALIAS: CONFIG.quelle, Zeilen: sample.rows }] } };
        dataArrived();
      } else {
        connect();
      }
      // Uhr und Minuten laufen weiter.
      let shownMinute = nowMinute();
      setInterval(function () {
        if (nowMinute() === shownMinute) return;
        shownMinute = nowMinute();
        showClock();
        if (loadedRows !== null) takeRows(loadedRows);
      }, 5000);
    });
  </script>
</body>
</html>
